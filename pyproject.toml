[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbb-similarity"
version = "0.1.0"
description = "College basketball team archetypes (KMeans) and similarity comps (cosine KNN)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "plotly>=5.20",
]

[project.optional-dependencies]
notebook = ["ipykernel", "nbformat>=4.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cbb-similarity = "cbb_similarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
